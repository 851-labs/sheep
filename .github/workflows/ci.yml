name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Xcode 16 is required for Swift 6; the product targets macOS 13.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve Ghostty revision
        id: ghostty-revision
        run: echo "revision=$(git -C .repos/ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify HerdrSDK schema generation
        run: Scripts/check-herdr-sdk-generation.sh

      - name: Test HerdrSDK at 100% handwritten coverage
        run: Scripts/check-herdr-sdk-coverage.sh

      - name: Cache GhosttyKit
        id: ghostty-cache
        uses: actions/cache/restore@v4
        with:
          path: .repos/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-${{ steps.ghostty-revision.outputs.revision }}-zig-0.16.0-${{ runner.os }}-macos13-universal-v3

      - name: Build GhosttyKit
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: Scripts/bootstrap-ghostty.sh

      - name: Save GhosttyKit
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .repos/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-${{ steps.ghostty-revision.outputs.revision }}-zig-0.16.0-${{ runner.os }}-macos13-universal-v3

      - name: Build universal macOS app
        run: Scripts/build-universal-macos.sh

      - name: Test
        run: |
          xcodebuild \
            -project Sheep.xcodeproj \
            -scheme Sheep \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
