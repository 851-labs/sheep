name: Sheep
options:
  bundleIdPrefix: com.851labs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
packages:
  HerdrSDK:
    path: Packages/HerdrSDK
targets:
  Sheep:
    type: application
    platform: macOS
    sources: Sources/Sheep
    dependencies:
      - package: HerdrSDK
        product: HerdrSDK
      - package: HerdrSDK
        product: HerdrSDKLocal
      - framework: .repos/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.sheep
        PRODUCT_NAME: sheep
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_KEY_CFBundleDisplayName: sheep
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 851 Labs
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -lstdc++"
    scheme:
      testTargets:
        - SheepTests
  SheepTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/SheepTests
    dependencies:
      - target: Sheep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.sheep.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/sheep.app/Contents/MacOS/sheep"
        BUNDLE_LOADER: "$(TEST_HOST)"
